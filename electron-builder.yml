appId: local.allinone.workspace
productName: All In One Workspace
directories:
  output: release
files:
  - out/**
  - '!out/installer/**'
  - package.json
extraResources:
  - from: out/installer/aio-update-installer
    to: aio-update-installer
asar: true
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  identity: null
  target:
    - zip
    - dmg
    - dir
dmg:
  title: All In One Workspace
# Release filenames use the package name; productName remains the App's display name.
artifactName: '${name}-${version}-${arch}.${ext}'
